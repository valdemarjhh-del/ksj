
<!DOCTYPE html>
<html>
<head>
<title>Traffic Lights</title>

<style>
body {
    background: #222;
    color: white;
    font-family: Arial;
    text-align: center;
    padding-top: 30px;
}

.traffic-light {
    background: black;
    width: 120px;
    padding: 15px;
    margin: 30px auto;
    border-radius: 20px;
    border: 4px solid #555;
}

.light {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 12px auto;
    background-color: #444;
    border: 2px solid #666;
}

#red.on {
    background: #ff0000;
    box-shadow: 0 0 35px red;
}

#yellow.on {
    background: #ffff00;
    box-shadow: 0 0 35px yellow;
}

#green.on {
    background: #00ff00;
    box-shadow: 0 0 35px lime;
}

button {
    padding: 12px 25px;
    margin: 8px;
    cursor: pointer;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>Traffic Light</h1>

<div class="traffic-light">
    <div class="light" id="red"></div>
    <div class="light" id="yellow"></div>
    <div class="light" id="green"></div>
</div>

<button onclick="start()">START</button>
<button onclick="stop()">STOP</button>

<p>Press SPACE to start or stop</p>

<script>
let running = false;
let timer;
let step = 0;

const lights = [
    {id: "red", delay: 3000},
    {id: "yellow", delay: 1000},
    {id: "green", delay: 3000},
    {id: "yellow", delay: 1000}
];

function turnOff() {
    document.querySelectorAll(".light").forEach(light => {
        light.classList.remove("on");
    });
}

function next() {
    if (!running) return;

    turnOff();

    let current = lights[step];

    document.getElementById(current.id).classList.add("on");

    timer = setTimeout(() => {
        step = (step + 1) % lights.length;
        next();
    }, current.delay);
}

function start() {
    if (running) return;
    running = true;
    step = 0;
    next();
}

function stop() {
    running = false;
    clearTimeout(timer);
    turnOff();
}

document.addEventListener("keydown", function(event) {
    if (event.code === "Space" && !event.repeat) {
        event.preventDefault();

        if (running) {
            stop();
        } else {
            start();
        }
    }
});
</script>

</body>
</html>
